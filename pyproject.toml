[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asrr-core"
version = "0.1.0"
description = "Policy-agnostic core components for Action Sequence Residual Refinement."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "torch>=2.0",
]

[tool.setuptools]
packages = ["asrr_core"]
