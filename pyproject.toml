[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asrr"
version = "0.1.0"
description = "Action Sequence Residual Refinement for robot policies"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
]

[project.optional-dependencies]
jax = [
    "jax",
    "flax",
]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
include = ["asrr_core*", "examples*"]
